name: Release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v1.2.0)'
        required: true
      notes:
        description: 'Release notes (Markdown, optional — auto-generated if empty)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The zip is built from a NAMED list, so anything not listed here never ships, and a
      # missing item warns rather than silently building a smaller zip. Keep this list in step
      # with the plugin's top-level files and folders. The asset is always
      # verification-expiry-for-hivepress.zip, with no version in the name, so the permanent
      # /releases/latest/download/ link keeps working on every release.
      - name: Build plugin zip
        run: |
          SLUG=verification-expiry-for-hivepress
          mkdir -p "build/$SLUG"
          for item in "$SLUG.php" uninstall.php readme.txt license.txt includes assets languages; do
            if [ -e "$item" ]; then
              cp -r "$item" "build/$SLUG/"
            else
              echo "warning: $item is absent from the repository" >&2
            fi
          done
          cd build
          zip -r "$SLUG.zip" "$SLUG"
          unzip -l "$SLUG.zip"

      - name: Create or refresh the release (manual dispatch)
        if: github.event_name == 'workflow_dispatch'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag }}
          NOTES: ${{ inputs.notes }}
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            git tag -f "$TAG" "$GITHUB_SHA"
            git push --force origin "refs/tags/$TAG"
            if [ -n "$NOTES" ]; then
              gh release edit "$TAG" --notes "$NOTES" --repo "$GITHUB_REPOSITORY"
            fi
            gh release upload "$TAG" build/verification-expiry-for-hivepress.zip --clobber --repo "$GITHUB_REPOSITORY"
          elif [ -n "$NOTES" ]; then
            gh release create "$TAG" build/verification-expiry-for-hivepress.zip --title "$TAG" --notes "$NOTES" --target "$GITHUB_SHA" --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" build/verification-expiry-for-hivepress.zip --title "$TAG" --generate-notes --target "$GITHUB_SHA" --repo "$GITHUB_REPOSITORY"
          fi

      - name: Upload asset to the release
        if: github.event_name == 'release'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "$GITHUB_REF_NAME" build/verification-expiry-for-hivepress.zip --clobber --repo "$GITHUB_REPOSITORY"
